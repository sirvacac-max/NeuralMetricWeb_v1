<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeuralMetric Web - Perioperative EEG analysis</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link rel="preload" id="webassembly" href="_framework/dotnet.js" as="script" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="NeuralMetricWeb_v1.styles.css" />
    <script type="importmap"></script>
    <script src="js/theme.js"></script>
</head>

<body>
    <div id="app">
        <div class="boot">
            <svg class="boot-glyph" viewBox="0 0 48 24" fill="none" aria-hidden="true">
                <path d="M1 12 H9 l2 -8 3 15 2 -10 2 6 2 -3 h5 l2 7 3 -13 2 9 2 -4 H46"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <div class="boot-name">NeuralMetric Web</div>
            <div class="boot-spinner"></div>
            <div class="boot-note">Loading the analyzer...</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">×</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
